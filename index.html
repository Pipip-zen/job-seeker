<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobSeeker - Cari Kerja Impianmu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="index">
  <main>
    <section class="hero-section">
      <div class="container hero-content">
        <p class="hero-kicker">Platform karier modern untuk talenta digital.</p>
        <h1>Temukan Pekerjaan Impianmu</h1>
        <p>Ribuan lowongan kerja menantimu di sini.</p>
        <form class="search-form row g-2 justify-content-center mt-4" onsubmit="handleSearch(event)">
          <input
            id="mainSearch"
            class="search-input"
            type="search"
            placeholder="Cari posisi atau perusahaan..."
            aria-label="Cari lowongan"
          >
          <button class="search-button" type="submit">Cari</button>
        </form>
      </div>
    </section>

    <section class="featured-section">
      <div class="container">
        <div class="featured-heading">
          <div>
            <p class="hero-kicker">Featured Jobs</p>
            <h2 class="section-heading">Lowongan pilihan untuk mulai langkah berikutnya.</h2>
          </div>
          <a class="button button-secondary" href="jobs.html">Lihat Semua</a>
        </div>
        <div id="featuredJobs" class="job-grid"></div>
      </div>
    </section>
  </main>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
